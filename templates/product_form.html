{% extends "base.html" %}
{% set p = p or {} %}
{% set cat_id = (p['category_id'] or 0) | int %}
{% set sup_id = (p['supplier_id'] or 0) | int %}
{% block title %}{{ action }} product{% endblock %}
{% block content %}
<h1>{{ action }} product</h1>
<form method="post" class="form">
  <label>SKU<input name="sku" value="{{ p['sku'] or '' }}" placeholder="optional"></label>
  <label>Name *<input name="name" value="{{ p['name'] or '' }}" required autofocus></label>
  <label>Barcode<input name="barcode" value="{{ p['barcode'] or '' }}" placeholder="scan value or free-text slug like 120mmfan"></label>
  <label>Brand<input name="brand" value="{{ p['brand'] or '' }}"></label>
  <label>Model<input name="model" value="{{ p['model'] or '' }}"></label>
  <label>Category
    <select name="category_id">
      <option value="">- none -</option>
      {% for c in categories %}
        <option value="{{ c['id'] }}" {{ 'selected' if c['id'] == cat_id }}>{{ c['name'] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Supplier
    <select name="supplier_id">
      <option value="">- none -</option>
      {% for s in suppliers %}
        <option value="{{ s['id'] }}" {{ 'selected' if s['id'] == sup_id }}>{{ s['name'] }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Cost<input name="cost" type="number" step="0.01" min="0" value="{{ p['cost'] or 0 }}"></label>
  <label>Sell price<input name="price" type="number" step="0.01" min="0" value="{{ p['price'] or 0 }}"></label>
  <label>Qty on hand<input name="qty" type="number" min="0" value="{{ p['qty'] or 0 }}"></label>
  <label>Reorder level<input name="low_stock_at" type="number" min="0" value="{{ p['low_stock_at'] or 5 }}"></label>
  <label>Specifications<textarea name="specifications" rows="3">{{ p['specifications'] or '' }}</textarea></label>
  <div class="row">
    <button class="btn">{{ action }}</button>
    <a class="btn ghost" href="{{ url_for('inventory') }}">Cancel</a>
  </div>
</form>

{% endblock %}
